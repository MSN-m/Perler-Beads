<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最终候选算法测试 · 拼豆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen bg-[#E7EBEE] text-slate-800">
<main class="mx-auto max-w-[1500px] px-5 py-6">
    <header class="mb-5 flex flex-wrap items-end justify-between gap-4"><div><p class="text-xs font-bold uppercase tracking-[0.18em] text-pink-500">Perler Beads Lab</p><h1 class="mt-1 text-2xl font-black">最终候选算法测试</h1><p class="mt-1 text-sm text-slate-500">用于人工验收颜色、主体轮廓与可制作性；不写入正式生成流程。</p></div><div class="flex gap-2"><a href="./algorithm-lab-complete.html" class="rounded-xl bg-white px-4 py-2 text-sm font-bold shadow-sm">完整策略实验</a><a href="./index.html" class="rounded-xl bg-white px-4 py-2 text-sm font-bold shadow-sm">返回生成器</a></div></header>
    <section class="grid gap-4 lg:grid-cols-[280px_minmax(0,1fr)]"><aside class="rounded-2xl bg-white p-4 shadow-sm"><h2 class="font-bold">统一测试参数</h2><label class="mt-4 block text-sm font-bold">上传图片<input id="final-image-input" type="file" accept="image/*" class="mt-2 block w-full text-xs"></label><label class="mt-3 block text-xs font-bold">最长边格数<input id="final-grid-size" type="number" min="16" max="104" step="4" value="100" class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-2"></label><label class="mt-3 block text-xs font-bold">拼豆品牌<select id="final-brand" class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-2 text-sm"><option value="mard">MARD</option><option value="perler">Perler</option><option value="hama">Hama</option><option value="artkal">Artkal</option></select></label><label class="mt-3 block text-xs font-bold">最大颜色种类<input id="final-max-colors" type="number" min="4" max="80" value="12" class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-2"></label><button id="final-generate-btn" disabled class="mt-5 w-full rounded-xl bg-slate-900 px-4 py-3 text-sm font-bold text-white disabled:cursor-not-allowed disabled:opacity-40">生成候选结果</button><p id="final-status" class="mt-3 text-xs leading-5 text-slate-400">请先上传图片。</p><div class="mt-4 rounded-xl bg-pink-50 p-3 text-xs leading-5 text-pink-700"><b>验收重点：</b>颜色不发乌、主体边缘与关键细节准确、背景碎色可控。</div></aside><section class="grid gap-4 md:grid-cols-2 xl:grid-cols-5"><article class="overflow-hidden rounded-2xl bg-white shadow-sm"><div class="border-b border-slate-100 px-4 py-3"><h2 class="font-black">原图</h2><p class="mt-1 text-xs text-slate-400">输入参考。</p></div><div class="relative aspect-square bg-slate-50"><canvas id="final-source" class="absolute inset-0 h-full w-full object-contain"></canvas></div><div id="final-source-stats" class="border-t border-slate-100 px-4 py-3 text-center text-xs text-slate-400">—</div></article><article class="overflow-hidden rounded-2xl bg-white shadow-sm"><div class="border-b border-slate-100 px-4 py-3"><h2 class="font-black">主体掩码</h2><p class="mt-1 text-xs text-slate-400">白：主体；深色：连接至边缘的背景。</p></div><div class="relative aspect-square bg-slate-50"><canvas id="final-mask" class="absolute inset-0 h-full w-full image-pixelated"></canvas></div><div id="final-mask-stats" class="border-t border-slate-100 px-4 py-3 text-center text-xs text-slate-400">—</div></article><article class="overflow-hidden rounded-2xl bg-white shadow-sm"><div class="border-b border-slate-100 px-4 py-3"><h2 class="font-black">轮廓层</h2><p class="mt-1 text-xs text-slate-400">主体与背景接触的连续边界。</p></div><div class="relative aspect-square bg-slate-50"><canvas id="final-contours" class="absolute inset-0 h-full w-full image-pixelated"></canvas></div><div id="final-contour-stats" class="border-t border-slate-100 px-4 py-3 text-center text-xs text-slate-400">—</div></article><article class="overflow-hidden rounded-2xl bg-white shadow-sm"><div class="border-b border-slate-100 px-4 py-3"><h2 class="font-black">正式基准</h2><p class="mt-1 text-xs text-slate-400">现有正式生成器。</p></div><div class="relative aspect-square bg-slate-50"><canvas id="final-baseline" class="absolute inset-0 h-full w-full image-pixelated"></canvas></div><div id="final-baseline-stats" class="border-t border-slate-100 px-4 py-3 text-center text-xs text-slate-400">—</div></article><article class="overflow-hidden rounded-2xl bg-white shadow-sm ring-2 ring-pink-200"><div class="border-b border-pink-100 bg-pink-50 px-4 py-3"><h2 class="font-black">最终候选</h2><p class="mt-1 text-xs text-pink-600">线性色彩取样 + 主体掩码 + 感知匹配。</p></div><div class="relative aspect-square bg-slate-50"><canvas id="final-result" class="absolute inset-0 h-full w-full image-pixelated"></canvas></div><div id="final-result-stats" class="border-t border-pink-100 px-4 py-3 text-center text-xs text-slate-500">—</div></article></section></section>
</main><script type="module" src="./src/algorithm-lab-final.js"></script></body></html>
