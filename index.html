<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼豆图案生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF7F50', // 活力橙
                        secondary: '#4ECDC4', // 天蓝
                        background: '#F7F9FC',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }

    <style>
        /* Custom Utilities */
        .step-section {
            display: none;
            height: 100vh;
            flex-direction: column;
            overflow: hidden;
        }

        .step-section.active {
            display: flex;
        }

        /* Hide scrollbar for gallery but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
        }

        @supports (scrollbar-width: none) {
            .no-scrollbar {
                scrollbar-width: none;
            }

</head>

            </p>

            <div class="relative group w-48 h-48">
                <div

                </div>
                <label for="file-upload"

                    <svg class="w-12 h-12 text-primary mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                    <span class="text-xs text-gray-400 mt-1">支持 JPG, PNG</span>
                </label>

        </div>

    </section>

        </div>

        </div>

                { id: 'M78', name: '暗灰', r: 169, g: 169, b: 169, sets: [96, 144, 168, 192, 216] },
                { id: 'M79', name: '银色', r: 192, g: 192, b: 192, sets: [96, 144, 168, 192, 216] },
                { id: 'M80', name: '亮灰', r: 211, g: 211, b: 211, sets: [96, 144, 168, 192, 216] },

                // 216色及以上 (极限补全)
                // 替换之前的随机生成，改为系统的色阶补全以确保色彩覆盖率
                ...(() => {
                    const extraColors = [];
                    const hues = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];
                    const sats = [40, 70, 100];
                    const lights = [30, 50, 70, 90];
                    
                    let count = 0;
                    for (let h of hues) {
                        for (let s of sats) {
                            for (let l of lights) {
                                if (count < 136) {
                                    // HSL to RGB conversion
                                    const sNorm = s / 100;
                                    const lNorm = l / 100;
                                    const c = (1 - Math.abs(2 * lNorm - 1)) * sNorm;
                                    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
                                    const m = lNorm - c / 2;
                                    let r = 0, g = 0, b = 0;
                                    if (0 <= h && h < 60) { r = c; g = x; b = 0; }
                                    else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
                                    else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
                                    else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
                                    else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
                                    else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
                                    
                                    extraColors.push({
                                        id: `M${81 + count}`,
                                        name: `补充色${count + 1}`,
                                        r: Math.round((r + m) * 255),
                                        g: Math.round((g + m) * 255),
                                        b: Math.round((b + m) * 255),
                                        sets: [144, 168, 192, 216]
                                    });
                                    count++;
                                }
                            }
                        }
                    }
                    // 如果还没满136个，补一些灰色阶
                    const graySteps = [10, 20, 30, 40, 50, 60, 70, 80, 90];
                    for (let g of graySteps) {
                        if (count < 136) {
                            const val = Math.round(g * 2.55);
                            extraColors.push({
                                id: `M${81 + count}`,
                                name: `灰色阶${count + 1}`,
                                r: val, g: val, b: val,
                                sets: [144, 168, 192, 216]
                            });
                            count++;
                        }
                    }
                    return extraColors;
                })()
            ],
            perler: [
                { id: 'P01', name: '白色', r: 255, g: 255, b: 255 },
                { id: 'P02', name: '奶油色', r: 227, g: 216, b: 172 },
                { id: 'P03', name: '黄色', r: 247, g: 229, b: 59 },
                { id: 'P04', name: '橙色', r: 255, g: 108, b: 47 },
                { id: 'P05', name: '红色', r: 190, g: 0, b: 47 },
                { id: 'P06', name: '粉色', r: 255, g: 147, b: 192 },
                { id: 'P07', name: '紫色', r: 104, g: 58, b: 154 },
                { id: 'P08', name: '深蓝', r: 13, g: 43, b: 109 },
                { id: 'P09', name: '浅蓝', r: 28, g: 151, b: 210 },
                { id: 'P10', name: '深绿', r: 0, g: 103, b: 62 },
                { id: 'P11', name: '浅绿', r: 105, g: 190, b: 90 },
                { id: 'P12', name: '棕色', r: 76, g: 46, b: 36 },
                { id: 'P13', name: '灰色', r: 129, g: 132, b: 138 },
                { id: 'P14', name: '黑色', r: 0, g: 0, b: 0 },
                { id: 'P18', name: '深黑', r: 45, g: 45, b: 45 },
                { id: 'P17', name: '灰白', r: 140, g: 140, b: 140 },
                { id: 'P19', name: '透明', r: 255, g: 255, b: 255, alpha: 0.2 }, // 可能需要特殊处理
                { id: 'P20', name: '铁锈红', r: 161, g: 67, b: 40 },
                { id: 'P21', name: '浅棕', r: 168, g: 112, b: 66 },
            ],
            hama: [
                { id: 'H01', name: '白色', r: 255, g: 255, b: 255 },
                { id: 'H05', name: '红色', r: 204, g: 0, b: 0 },
                { id: 'H18', name: '黑色', r: 0, g: 0, b: 0 },
                // ... 生产环境需添加更多颜色
            ]
        };

        const AppState = {
            currentStep: 1,
            image: null,
            canvasSize: 0, // 像素
            gridWidth: 32, // 数量
            gridHeight: 32, // 数量
            brand: 'mard',
            mardSet: 216,
            pixelData: [], // 颜色对象数组
        };

        // --- 导航逻辑 ---
        function goToStep(step) {
            document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
            document.querySelector(`#step-${getStepName(step)}`).classList.add('active');
            AppState.currentStep = step;

            if (step === 2) initSettingsCanvas();
            if (step === 4) initExportPreview();
        }

        function getStepName(step) {
            return ['home', 'settings', 'editor', 'export'][step - 1];
        }

        // --- 第一步：上传 ---
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            processFile(file);
        }

        function loadExample(type) {
            const urls = {
                dog: './image/ScreenShot_2026-01-28_172218_549.png',
                flower: './image/ScreenShot_2026-01-28_172329_266.png',
                pixel: './image/ScreenShot_2026-01-28_172400_944.png'
            };
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                AppState.image = img;
                goToStep(2);
            };
            img.src = urls[type];
        }

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    AppState.image = img;
                    goToStep(2);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- 第二步：设置 ---
        const sourceCanvas = document.getElementById('source-canvas');
        const ctxSource = sourceCanvas.getContext('2d');
        const slider = document.getElementById('grid-size-slider');
        const brandSelect = document.getElementById('brand-select');
        const mardSetSelect = document.getElementById('mard-set-select');
        const mardSetContainer = document.getElementById('mard-set-container');
        const sizeDisplay = document.getElementById('grid-size-display');

        slider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            const ratio = AppState.image ? AppState.image.width / AppState.image.height : 1;
            
            if (ratio >= 1) {
                AppState.gridWidth = val;
                AppState.gridHeight = Math.round(val / ratio);
            } else {
                AppState.gridHeight = val;
                AppState.gridWidth = Math.round(val * ratio);
            }
            
            sizeDisplay.innerText = `${AppState.gridWidth}x${AppState.gridHeight}`;
        });

        brandSelect.addEventListener('change', (e) => {
            AppState.brand = e.target.value;
            if (AppState.brand === 'mard') {
                mardSetContainer.classList.remove('hidden');
            } else {
                mardSetContainer.classList.add('hidden');
            }
        });

        mardSetSelect.addEventListener('change', (e) => {
            AppState.mardSet = parseInt(e.target.value);
        });

        function initSettingsCanvas() {
            if (!AppState.image) return;

            const img = AppState.image;
            const ratio = img.width / img.height;
            const container = document.getElementById('canvas-container');

            // 设置容器的宽高比，确保背景白色区域完全匹配图片
            container.style.aspectRatio = `${img.width} / ${img.height}`;

            // 设置 canvas 原始尺寸为图片尺寸
            sourceCanvas.width = img.width;
            sourceCanvas.height = img.height;

            // 直接绘制完整图片，不进行裁剪
            ctxSource.drawImage(img, 0, 0);

            // 初始计算网格尺寸
            const val = parseInt(slider.value);
            if (ratio >= 1) {
                AppState.gridWidth = val;
                AppState.gridHeight = Math.round(val / ratio);
            } else {
                AppState.gridHeight = val;
                AppState.gridWidth = Math.round(val * ratio);
            }
            sizeDisplay.innerText = `${AppState.gridWidth}x${AppState.gridHeight}`;
        }

        // --- 核心算法：像素化与颜色匹配 ---
        function generatePattern() {
            const gridWidth = AppState.gridWidth;
            const gridHeight = AppState.gridHeight;
            
            // 获取源图像数据
            const sourceWidth = sourceCanvas.width;
            const sourceHeight = sourceCanvas.height;
            const sourceData = ctxSource.getImageData(0, 0, sourceWidth, sourceHeight).data;

            let palette = PALETTES[AppState.brand] || PALETTES.perler;
            
            // 如果是 MARD，根据套装规格过滤颜色
            if (AppState.brand === 'mard') {
                palette = palette.filter(c => c.sets.includes(AppState.mardSet));
            }

            AppState.pixelData = [];
            const resultPixels = new Uint8ClampedArray(gridWidth * gridHeight * 4);

            // 使用块平均法 (Box Sampling) 进行下采样，确保精准度
            for (let y = 0; y < gridHeight; y++) {
                for (let x = 0; x < gridWidth; x++) {
                    // 计算每个网格在源图中的范围
                    const startX = Math.floor((x / gridWidth) * sourceWidth);
                    const startY = Math.floor((y / gridHeight) * sourceHeight);
                    const endX = Math.floor(((x + 1) / gridWidth) * sourceWidth);
                    const endY = Math.floor(((y + 1) / gridHeight) * sourceHeight);

                    let rSum = 0, gSum = 0, bSum = 0, count = 0;

                    // 遍历块内所有源像素
                    for (let sy = startY; sy < endY; sy++) {
                        for (let sx = startX; sx < endX; sx++) {
                            const idx = (sy * sourceWidth + sx) * 4;
                            rSum += sourceData[idx];
                            gSum += sourceData[idx + 1];
                            bSum += sourceData[idx + 2];
                            count++;
                        }
                    }

                    // 计算平均值
                    const rAvg = count > 0 ? rSum / count : 255;
                    const gAvg = count > 0 ? gSum / count : 255;
                    const bAvg = count > 0 ? bSum / count : 255;

                    // 匹配最近颜色
                    const matched = findNearestColor(rAvg, gAvg, bAvg, palette);
                    AppState.pixelData.push(matched);

                    const outIdx = (y * gridWidth + x) * 4;
                    resultPixels[outIdx] = matched.r;
                    resultPixels[outIdx + 1] = matched.g;
                    resultPixels[outIdx + 2] = matched.b;
                    resultPixels[outIdx + 3] = 255;
                }
            }

            goToStep(3);
            renderResult(resultPixels, gridWidth, gridHeight);
            calculateStats();
        }

        function findNearestColor(r, g, b, palette) {
            let minDist = Infinity;
            let nearest = palette[0];

            for (let color of palette) {
                // 使用 Redmean 颜色距离算法 (比纯欧几里得距离更符合人眼感知)
                const rMean = (r + color.r) / 2;
                const dr = r - color.r;
                const dg = g - color.g;
                const db = b - color.b;
                
                // Redmean 权重公式
                const d = (2 + rMean / 256) * (dr * dr) + 
                          4 * (dg * dg) + 
                          (2 + (255 - rMean) / 256) * (db * db);

                if (d < minDist) {
                    minDist = d;
                    nearest = color;
                }
            }
            return nearest;
        }

        // --- 第三步：编辑/预览 ---
        const resultCanvas = document.getElementById('result-canvas');
        const ctxResult = resultCanvas.getContext('2d');

        function renderResult(pixelArray, gridWidth, gridHeight) {
            // Upscale for visibility
            const scale = 20; // px per bead
            resultCanvas.width = gridWidth * scale;
            resultCanvas.height = gridHeight * scale;
            
            // 同步更新预览容器的比例
            const container = document.getElementById('result-container');
            resultCanvas.style.aspectRatio = `${gridWidth} / ${gridHeight}`;

            // Disable smoothing for pixel art look
            ctxResult.imageSmoothingEnabled = false;

            // Draw grid
            for (let y = 0; y < gridHeight; y++) {
                for (let x = 0; x < gridWidth; x++) {
                    const i = (y * gridWidth + x);
                    const color = AppState.pixelData[i];

                    ctxResult.fillStyle = `rgb(${color.r},${color.g},${color.b})`;
                    ctxResult.fillRect(x * scale, y * scale, scale, scale);

                    // Optional: Draw bead circle effect
                    ctxResult.strokeStyle = 'rgba(0,0,0,0.1)';
                    ctxResult.strokeRect(x * scale, y * scale, scale, scale);

                    ctxResult.beginPath();
                    ctxResult.arc(x * scale + scale / 2, y * scale + scale / 2, scale / 2 - 1, 0, Math.PI * 2);
                    ctxResult.fillStyle = 'rgba(255,255,255,0.15)'; // Shine effect
                    ctxResult.fill();
                }
            }
        }

        function calculateStats() {
            const stats = {};
            AppState.pixelData.forEach(p => {
                if (!stats[p.id]) stats[p.id] = { ...p, count: 0 };
                stats[p.id].count++;
            });

            const sorted = Object.values(stats).sort((a, b) => b.count - a.count);

            const container = document.getElementById('color-stats');
            container.innerHTML = sorted.map(c => `
                <div class="flex items-center justify-between p-2 bg-gray-700 rounded-lg">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full border-2 border-white/20 shadow-sm" style="background-color: rgb(${c.r},${c.g},${c.b})"></div>
                        <div class="text-white">
                            <div class="text-xs font-bold">${c.name}</div>
                            <div class="text-[10px] text-gray-400 font-mono">${c.id}</div>
                        </div>
                    </div>
                    <div class="text-white font-mono font-bold text-sm bg-gray-600 px-2 py-1 rounded">x${c.count}</div>
                </div>
            `).join('');
        }

        // --- 第四步：导出 ---
        function initExportPreview() {
            const exportImg = document.getElementById('export-preview');
            exportImg.src = resultCanvas.toDataURL();
            document.getElementById('export-meta').innerText = `${AppState.gridWidth}x${AppState.gridHeight} • ${AppState.brand.charAt(0).toUpperCase() + AppState.brand.slice(1)}`;
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = `perler-pattern-${Date.now()}.png`;
            link.href = resultCanvas.toDataURL();
            link.click();
        }

        function downloadSVG() {
            // Basic SVG generation
            const scale = 20;
            const width = AppState.gridWidth * scale;
            const height = AppState.gridHeight * scale;
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;

            // Background
            svg += `<rect width="${width}" height="${height}" fill="#eee"/>`;

            AppState.pixelData.forEach((color, i) => {
                const x = (i % AppState.gridWidth) * scale;
                const y = Math.floor(i / AppState.gridWidth) * scale;
                svg += `<circle cx="${x + scale / 2}" cy="${y + scale / 2}" r="${scale / 2 - 1}" fill="rgb(${color.r},${color.g},${color.b})" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>`;
            });

            svg += `</svg>`;

            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = `perler-pattern-${Date.now()}.svg`;
            link.href = url;
            link.click();
        }

        // Custom image pixelation style via CSS
        const sheet = new CSSStyleSheet();
        sheet.replaceSync(`.image-pixelated { image-rendering: pixelated; }`);
        document.adoptedStyleSheets = [sheet];

    </script>
