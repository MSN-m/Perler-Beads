<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼豆图案生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 备用样式，以防 JS 加载失败 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" integrity="sha512-wnea99uKIC3mpJF7V4EONKoqGWheWLCWJVYoPaDU8MS5n6GIQ9lP3V7LDl6bmp2JCIXC6mLRsh6naU6cdKvg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script>
        if (window.tailwind) {
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: '#FF7F50', // 活力橙
                            secondary: '#4ECDC4', // 天蓝
                            background: '#F7F9FC',
                        },
                        fontFamily: {
                            sans: ['Inter', 'system-ui', 'sans-serif'],
                        }
                    }
                }
            }
        } else {
            console.warn('Tailwind CDN 加载失败，正在尝试备用方案...');
        }
    </script>
    <style>
        /* Custom Utilities */
        .step-section {
            display: none;
            height: 100vh;
            flex-direction: column;
            overflow: hidden;
        }

        .step-section.active {
            display: flex;
        }

        /* Hide scrollbar for gallery but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
        }

        @supports (scrollbar-width: none) {
            .no-scrollbar {
                scrollbar-width: none;
            }
        }
    </style>
</head>

<body
    class="bg-background text-gray-800 font-sans h-screen w-screen overflow-hidden selection:bg-primary selection:text-white">

    <!-- Version Badge -->
    <div class="fixed top-0 left-0 bg-black/50 text-white text-xs px-2 py-1 z-[9999] pointer-events-none rounded-br">v:2026.01.29.PRO</div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-white/90 z-[10000] hidden flex-col justify-center items-center">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-primary"></div>
        <p class="mt-4 text-primary font-bold text-lg">正在生成图纸...</p>
    </div>

    <!-- Step 1: Home / Upload -->
    <section id="step-home" class="step-section active p-6 relative">
        <div class="flex-1 flex flex-col justify-center items-center text-center space-y-8">
            <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">
                拼豆大师
            </h1>
            <p class="text-gray-500 text-sm max-w-xs leading-relaxed">
                上传你喜欢的图片，一键生成专属的拼豆像素图纸。<br>简单、好玩、易上手！
            </p>

            <div class="relative group w-48 h-48">
                <div
                    class="absolute inset-0 bg-gradient-to-tr from-primary to-secondary rounded-3xl blur opacity-25 group-hover:opacity-40 transition duration-300 animate-pulse">
                </div>
                <label for="file-upload"
                    class="relative w-full h-full bg-white rounded-3xl shadow-xl flex flex-col justify-center items-center cursor-pointer transform transition group-hover:scale-105 border-2 border-transparent hover:border-primary/20">
                    <svg class="w-12 h-12 text-primary mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                        </path>
                    </svg>
                    <span class="font-bold text-gray-700">上传图片</span>
                    <span class="text-xs text-gray-400 mt-1">支持 JPG, PNG</span>
                </label>
                <input id="file-upload" type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            </div>
        </div>

        <div class="mt-auto pt-6 pb-8">
            <p class="text-xs text-center text-gray-400 mb-4 uppercase tracking-wider">或尝试示例图片</p>
            <div class="flex space-x-4 overflow-x-auto no-scrollbar px-4 pb-2 justify-center">
                <!-- Example Thumbnails -->
                <button onclick="loadExample('dog')" aria-label="加载狗狗示例"
                    class="flex-shrink-0 w-16 h-16 rounded-xl bg-white shadow-md overflow-hidden border border-gray-100"><img
                        src="./image/ScreenShot_2026-01-28_172218_549.png"
                        alt="狗狗示例" class="w-full h-full object-cover"></button>
                <button onclick="loadExample('flower')" aria-label="加载花朵示例"
                    class="flex-shrink-0 w-16 h-16 rounded-xl bg-white shadow-md overflow-hidden border border-gray-100"><img
                        src="./image/ScreenShot_2026-01-28_172329_266.png"
                        alt="花朵示例" class="w-full h-full object-cover"></button>
                <button onclick="loadExample('pixel')" aria-label="加载像素示例"
                    class="flex-shrink-0 w-16 h-16 rounded-xl bg-white shadow-md overflow-hidden border border-gray-100"><img
                        src="./image/ScreenShot_2026-01-28_172400_944.png"
                        alt="像素画示例" class="w-full h-full object-cover"></button>
            </div>
        </div>
    </section>

    <!-- Step 2: Settings / Crop -->
    <section id="step-settings" class="step-section bg-white">
        <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-white z-10">
            <button onclick="goToStep(1)" class="p-2 -ml-2 text-gray-500 hover:text-gray-800">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h2 class="font-bold text-lg">调整设置</h2>
            <div class="w-6"></div> <!-- Spacer for center alignment -->
        </div>

        <div class="flex-1 bg-gray-50 relative overflow-hidden flex items-center justify-center p-4">
            <!-- Image Canvas Area -->
            <div id="canvas-container"
                class="relative shadow-2xl rounded-sm bg-white overflow-visible flex items-center justify-center cursor-crosshair max-w-[90vw] max-h-[65vh]">
                <canvas id="source-canvas" class="max-w-full max-h-full block object-contain shadow-inner"></canvas>
                
                <!-- Background Removal Controls -->
                <div class="absolute bottom-2 right-2 flex flex-col-reverse space-y-reverse space-y-2 z-30">
                    <button id="remove-bg-btn" onclick="enableBgRemoval()" 
                        class="p-2.5 bg-white shadow-xl rounded-xl text-gray-700 hover:text-primary transition flex items-center space-x-2 text-xs font-bold border border-gray-100 whitespace-nowrap">
                        <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                        <span>点击图片移除背景</span>
                    </button>

                    <button id="undo-bg-btn" onclick="undoBgRemoval()" disabled
                        class="p-2.5 bg-white shadow-xl rounded-xl text-gray-400 hover:text-gray-700 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center space-x-2 text-xs font-bold border border-gray-100">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path>
                        </svg>
                        <span>撤销移除</span>
                    </button>

                    <button id="clean-fragments-btn" onclick="cleanTinyFragments()"
                        class="hidden p-2.5 bg-white shadow-xl rounded-xl text-gray-700 hover:text-secondary transition flex items-center space-x-2 text-xs font-bold border border-gray-100">
                        <svg class="w-4 h-4 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        <span>一键清理残留</span>
                    </button>

                    <!-- Tolerance Control (Hidden by default) -->
                    <div id="tolerance-panel" class="hidden p-3 bg-white/95 backdrop-blur shadow-xl rounded-xl border border-gray-100 flex-col space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">移除容差</span>
                            <span id="tolerance-value" class="text-xs font-mono text-primary font-bold">30</span>
                        </div>
                        <input type="range" id="tolerance-slider" min="5" max="100" value="30" 
                            class="w-32 h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary"
                            oninput="updateTolerance(this.value)">
                    </div>
                </div>

                <!-- Tip Overlay -->
                <div id="bg-remove-tip" class="absolute inset-0 bg-primary/10 pointer-events-none hidden items-center justify-center">
                    <div class="bg-white px-4 py-2 rounded-full shadow-lg text-primary text-sm font-bold animate-bounce">
                        请点击想要移除的颜色区域
                    </div>
                </div>
            </div>
        </div>

        <div class="p-6 bg-white shadow-[0_-4px_20px_rgba(0,0,0,0.05)] rounded-t-3xl z-20 space-y-6">

            <!-- Grid Size Slider -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <div class="flex items-center space-x-2">
                        <label class="text-sm font-semibold text-gray-700">像素密度 (大小)</label>
                        <span id="board-size-display" class="text-[10px] px-1.5 py-0.5 rounded-md font-bold"></span>
                    </div>
                    <span id="grid-size-display"
                        class="text-xs font-mono bg-gray-100 px-2 py-1 rounded text-primary font-bold">32x32</span>
                </div>
                <input type="range" id="grid-size-slider" min="16" max="104" step="4" value="32"
                    class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
            </div>

            <!-- Brand Selector -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-sm font-semibold text-gray-700 mb-2 block">拼豆品牌</label>
                    <select id="brand-select"
                        class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                        <option value="mard">MARD (默认)</option>
                        <option value="perler">Perler (常用)</option>
                        <option value="hama">Hama</option>
                        <option value="artkal">Artkal</option>
                    </select>
                </div>
                <div id="mard-set-container">
                    <label class="text-sm font-semibold text-gray-700 mb-2 block">套装规格</label>
                    <select id="mard-set-select"
                        class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                        <option value="264">MARD 264色全色 (不含C29)</option>
                        <option value="216">MARD 216色全实色</option>
                        <option value="144">MARD 144色 (A-E+6)</option>
                        <option value="120">MARD 120色 (A-E)</option>
                        <option value="96">MARD 96色 (1-4)</option>
                        <option value="72">MARD 72色 (1-3)</option>
                        <option value="48">MARD 48色 (1-2)</option>
                        <option value="24">MARD 24色 (1组)</option>
                    </select>
                </div>
            </div>

            <!-- 颜色限制逻辑 (新功能) -->
            <div class="p-4 bg-gray-50 rounded-2xl space-y-4 border border-gray-100">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <label class="text-sm font-bold text-gray-700">限制颜色数量</label>
                        <span class="text-[10px] bg-primary/10 text-primary px-1.5 py-0.5 rounded">BETA</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="color-limit-toggle" class="sr-only peer" onchange="toggleColorLimit()">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                    </label>
                </div>
                
                <div id="color-limit-controls" class="space-y-2 opacity-40 pointer-events-none transition-opacity">
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-gray-500">最大允许颜色种类</span>
                        <span id="max-colors-display" class="text-xs font-mono font-bold text-primary bg-white px-2 py-0.5 rounded border border-primary/20">24</span>
                    </div>
                    <input type="range" id="max-colors-slider" min="2" max="64" value="24" step="1"
                        class="w-full h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary"
                        oninput="updateMaxColorsDisplay()">
                    
                    <div class="flex items-center space-x-2 pt-1">
                        <input type="checkbox" id="dithering-toggle" checked class="w-4 h-4 text-primary rounded border-gray-300 focus:ring-primary">
                        <label for="dithering-toggle" class="text-[11px] text-gray-500">启用抖动算法 (更细节，但颗粒感稍强)</label>
                    </div>
                </div>
            </div>

            <button onclick="generatePattern()"
                class="w-full py-4 bg-primary text-white rounded-2xl font-bold shadow-lg shadow-primary/30 active:scale-95 transition flex justify-center items-center">
                <span>生成图纸</span>
                <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </button>
        </div>
    </section>

    <!-- Step 3: Editor / Result -->
    <section id="step-editor" class="step-section bg-gray-900">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900 z-10 text-white">
            <button onclick="goToStep(2)" class="p-2 -ml-2 text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h2 class="font-bold text-lg">图纸预览</h2>
            <button onclick="goToStep(4)" class="text-primary font-bold text-sm px-2">下一步</button>
        </div>

        <div class="flex-1 relative overflow-hidden flex items-center justify-center p-4" id="result-container">
            <canvas id="result-canvas" class="shadow-2xl image-pixelated cursor-grab"></canvas>
            
            <!-- Zoom Reset Button -->
            <button id="zoom-reset-btn" onclick="resetZoom()" 
                class="absolute bottom-6 right-6 p-2.5 bg-white/90 backdrop-blur shadow-xl rounded-full text-primary hover:scale-110 active:scale-95 transition-all opacity-0 pointer-events-none z-20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                </svg>
            </button>
        </div>

        <!-- Stats Panel -->
        <div class="h-48 bg-gray-800 rounded-t-3xl p-4 overflow-y-auto no-scrollbar">
            <h3 class="text-white text-sm font-bold mb-3 sticky top-0 bg-gray-800 py-1 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <span>颜色清单</span>
                    <span id="color-types-count" class="text-[10px] bg-primary/20 text-primary px-1.5 py-0.5 rounded"></span>
                </div>
                <span id="total-beads-count" class="text-gray-400 font-mono text-[10px]"></span>
            </h3>
            <div id="color-stats" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-1.5">
                <!-- Color items will be injected here -->
            </div>
        </div>
    </section>

    <!-- Step 4: Export -->
    <section id="step-export" class="step-section bg-background">
        <div class="p-4 flex justify-between items-center z-10">
            <button onclick="goToStep(3)" class="p-2 -ml-2 text-gray-500 hover:text-gray-800">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h2 class="font-bold text-lg">保存与分享</h2>
            <div class="w-6"></div>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center p-8 space-y-6">
            <div class="w-full max-w-sm bg-white p-4 rounded-2xl shadow-xl transform rotate-1">
                <img id="export-preview" class="w-full rounded-lg border border-gray-100 image-pixelated">
                <div class="mt-4 flex justify-between items-center">
                    <span class="text-xs text-gray-400" id="export-meta">32x32 • Perler</span>
                    <span class="text-xs font-bold text-primary">拼豆大师</span>
                </div>
            </div>

            <div class="w-full max-w-sm space-y-3">
                <button onclick="downloadImage()"
                    class="w-full py-3.5 bg-gray-900 text-white rounded-xl font-bold shadow-lg flex justify-center items-center active:scale-95 transition">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    保存图片
                </button>
                <button onclick="downloadSVG()"
                    class="w-full py-3.5 bg-white text-gray-900 border border-gray-200 rounded-xl font-bold shadow-sm flex justify-center items-center active:scale-95 transition">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                    </svg>
                    下载 SVG (矢量)
                </button>
            </div>
        </div>
    </section>

    <!-- Logic -->

        // --- 导航逻辑 ---
        function goToStep(step) {
            document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
            document.querySelector(`#step-${getStepName(step)}`).classList.add('active');
            AppState.currentStep = step;

            if (step === 2) initSettingsCanvas();
            if (step === 4) initExportPreview();
        }

        function getStepName(step) {
            return ['home', 'settings', 'editor', 'export'][step - 1];
        }

        // --- 第一步：上传 ---
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            processFile(file);
        }

        function loadExample(type) {
            const urls = {
                dog: './image/ScreenShot_2026-01-28_172218_549.png',
                flower: './image/ScreenShot_2026-01-28_172329_266.png',
                pixel: './image/ScreenShot_2026-01-28_172400_944.png'
            };
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                AppState.image = img;
                goToStep(2);
            };
            img.src = urls[type];
        }

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    AppState.image = img;
                    goToStep(2);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- 第二步：设置 ---
        const sourceCanvas = document.getElementById('source-canvas');
        const ctxSource = sourceCanvas.getContext('2d');
        const slider = document.getElementById('grid-size-slider');
        const brandSelect = document.getElementById('brand-select');
        const mardSetSelect = document.getElementById('mard-set-select');
        const mardSetContainer = document.getElementById('mard-set-container');
        const sizeDisplay = document.getElementById('grid-size-display');
        const boardSizeDisplay = document.getElementById('board-size-display');

        function updateBoardSizeUI() {
            const maxDim = Math.max(AppState.gridWidth, AppState.gridHeight);
            if (maxDim <= 52) {
                boardSizeDisplay.innerText = '52小板';
                boardSizeDisplay.className = 'text-[10px] px-1.5 py-0.5 rounded-md font-bold bg-blue-100 text-blue-600';
            } else {
                boardSizeDisplay.innerText = '104大板';
                boardSizeDisplay.className = 'text-[10px] px-1.5 py-0.5 rounded-md font-bold bg-purple-100 text-purple-600';
            }
        }

        slider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            const ratio = AppState.image ? AppState.image.width / AppState.image.height : 1;
            
            if (ratio >= 1) {
                AppState.gridWidth = val;
                AppState.gridHeight = Math.round(val / ratio);
            } else {
                AppState.gridHeight = val;
                AppState.gridWidth = Math.round(val * ratio);
            }
            
            sizeDisplay.innerText = `${AppState.gridWidth}x${AppState.gridHeight}`;
            updateBoardSizeUI();
        });

        brandSelect.addEventListener('change', (e) => {
            AppState.brand = e.target.value;
            if (AppState.brand === 'mard') {
                mardSetContainer.classList.remove('hidden');
            } else {
                mardSetContainer.classList.add('hidden');
            }
        });

        mardSetSelect.addEventListener('change', (e) => {
            AppState.mardSet = e.target.value; // 保持为字符串，以便与 case 匹配
            console.log('MARD Set updated to:', AppState.mardSet);
        });

        function initSettingsCanvas() {
            if (!AppState.image) return;

            const img = AppState.image;
            const container = document.getElementById('canvas-container');

            // 1. 获取容器的最大允许尺寸 (基于 CSS 限制)
            const maxWidth = window.innerWidth * 0.9;
            const maxHeight = window.innerHeight * 0.65;
            
            // 2. 计算缩放比例，确保图片完整展示且不超出
            const imgRatio = img.width / img.height;
            const containerRatio = maxWidth / maxHeight;
            
            let finalWidth, finalHeight;
            if (imgRatio > containerRatio) {
                // 图片更宽，以宽度为准
                finalWidth = maxWidth;
                finalHeight = maxWidth / imgRatio;
            } else {
                // 图片更高，以高度为准
                finalHeight = maxHeight;
                finalWidth = maxHeight * imgRatio;
            }

            // 3. 动态调整容器尺寸以紧贴图片边缘
            container.style.width = `${finalWidth}px`;
            container.style.height = `${finalHeight}px`;

            // 4. 设置 canvas 原始尺寸为图片尺寸
            sourceCanvas.width = img.width;
            sourceCanvas.height = img.height;

            // 5. 绘制图片
            ctxSource.drawImage(img, 0, 0);

            // 保存原始数据和历史记录
            AppState.originalImageData = ctxSource.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
            AppState.history = [ctxSource.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height)];
            updateUndoButton();

            // 更新网格尺寸
            const val = parseInt(slider.value);
            if (imgRatio >= 1) {
                AppState.gridWidth = val;
                AppState.gridHeight = Math.round(val / imgRatio);
            } else {
                AppState.gridHeight = val;
                AppState.gridWidth = Math.round(val * imgRatio);
            }
            sizeDisplay.innerText = `${AppState.gridWidth}x${AppState.gridHeight}`;
            updateBoardSizeUI();

            // 绑定事件
            sourceCanvas.onclick = handleCanvasClick;
            sourceCanvas.ontouchstart = (e) => {
                if (AppState.isBgRemoving) {
                    e.preventDefault();
                    handleCanvasClick(e);
                }
            };
        }

        function enableBgRemoval() {
            AppState.isBgRemoving = !AppState.isBgRemoving;
            const tip = document.getElementById('bg-remove-tip');
            const btn = document.getElementById('remove-bg-btn');
            const tolerancePanel = document.getElementById('tolerance-panel');
            const cleanBtn = document.getElementById('clean-fragments-btn');
            
            if (AppState.isBgRemoving) {
                tip.classList.remove('hidden');
                tip.classList.add('flex');
                tolerancePanel.classList.remove('hidden');
                tolerancePanel.classList.add('flex');
                cleanBtn.classList.remove('hidden');
                btn.classList.add('bg-primary', 'text-white');
                btn.classList.remove('bg-white');
                btn.querySelector('span').innerText = '取消移除模式';
            } else {
                tip.classList.add('hidden');
                tip.classList.remove('flex');
                tolerancePanel.classList.add('hidden');
                tolerancePanel.classList.remove('flex');
                cleanBtn.classList.add('hidden');
                btn.classList.remove('bg-primary', 'text-white');
                btn.classList.add('bg-white');
                btn.querySelector('span').innerText = '点击图片移除背景';
            }
        }

        function updateTolerance(val) {
            document.getElementById('tolerance-value').innerText = val;
        }

        function toggleColorLimit() {
            const isEnabled = document.getElementById('color-limit-toggle').checked;
            const controls = document.getElementById('color-limit-controls');
            if (isEnabled) {
                controls.classList.remove('opacity-40', 'pointer-events-none');
            } else {
                controls.classList.add('opacity-40', 'pointer-events-none');
            }
        }

        function updateMaxColorsDisplay() {
            const val = document.getElementById('max-colors-slider').value;
            document.getElementById('max-colors-display').innerText = val;
        }

        function handleCanvasClick(e) {
            if (!AppState.isBgRemoving) return;

            const rect = sourceCanvas.getBoundingClientRect();
            const scaleX = sourceCanvas.width / rect.width;
            const scaleY = sourceCanvas.height / rect.height;
            
            // 兼容鼠标和触摸事件
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = Math.floor((clientX - rect.left) * scaleX);
            const y = Math.floor((clientY - rect.top) * scaleY);

            removeBackground(x, y);
        }

        function removeBackground(startX, startY) {
            const imageData = ctxSource.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
            const data = imageData.data;
            const width = sourceCanvas.width;
            const height = sourceCanvas.height;

            const targetIdx = (startY * width + startX) * 4;
            const targetR = data[targetIdx];
            const targetG = data[targetIdx + 1];
            const targetB = data[targetIdx + 2];
            const targetA = data[targetIdx + 3];

            if (targetA === 0) return; // 已经是透明的

            const tolerance = parseInt(document.getElementById('tolerance-slider').value); // 使用动态容差
            const stack = [[startX, startY]];
            const visited = new Uint8Array(width * height);

            while (stack.length > 0) {
                const [x, y] = stack.pop();
                const idx = (y * width + x) * 4;

                if (visited[y * width + x]) continue;
                visited[y * width + x] = 1;

                const r = data[idx];
                const g = data[idx + 1];
                const b = data[idx + 2];
                const a = data[idx + 3];

                const dist = Math.sqrt(
                    Math.pow(r - targetR, 2) +
                    Math.pow(g - targetG, 2) +
                    Math.pow(b - targetB, 2)
                );

                if (a > 0 && dist < tolerance) {
                    data[idx + 3] = 0; // 设为透明

                    // 检查相邻像素
                    if (x > 0) stack.push([x - 1, y]);
                    if (x < width - 1) stack.push([x + 1, y]);
                    if (y > 0) stack.push([x, y - 1]);
                    if (y < height - 1) stack.push([x, y + 1]);
                }
            }

            ctxSource.putImageData(imageData, 0, 0);
            
            // 保存历史
            AppState.history.push(ctxSource.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height));
            if (AppState.history.length > 10) AppState.history.shift();
            updateUndoButton();
            
            // 自动退出移除模式
            enableBgRemoval();
        }

        function cleanTinyFragments() {
            const imageData = ctxSource.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
            const data = imageData.data;
            const width = sourceCanvas.width;
            const height = sourceCanvas.height;
            const minIslandSize = 15; // 判定为残留的像素阈值

            const visited = new Uint8Array(width * height);
            const toRemove = [];

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    if (data[idx + 3] > 0 && !visited[y * width + x]) {
                        // 发现一个色块，开始计算其大小
                        const island = [];
                        const stack = [[x, y]];
                        visited[y * width + x] = 1;

                        while (stack.length > 0) {
                            const [currX, currY] = stack.pop();
                            island.push([currX, currY]);

                            const neighbors = [
                                [currX - 1, currY], [currX + 1, currY],
                                [currX, currY - 1], [currX, currY + 1]
                            ];

                            for (const [nx, ny] of neighbors) {
                                if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                    const nIdx = (ny * width + nx) * 4;
                                    if (data[nIdx + 3] > 0 && !visited[ny * width + nx]) {
                                        visited[ny * width + nx] = 1;
                                        stack.push([nx, ny]);
                                    }
                                }
                            }
                        }

                        // 如果色块太小，标记为移除
                        if (island.length < minIslandSize) {
                            toRemove.push(...island);
                        }
                    }
                }
            }

            // 执行移除
            toRemove.forEach(([rx, ry]) => {
                const idx = (ry * width + rx) * 4;
                data[idx + 3] = 0;
            });

            ctxSource.putImageData(imageData, 0, 0);
            
            // 保存历史
            AppState.history.push(ctxSource.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height));
            if (AppState.history.length > 10) AppState.history.shift();
            updateUndoButton();
        }

        function undoBgRemoval() {
            if (AppState.history.length > 1) {
                AppState.history.pop();
                const lastData = AppState.history[AppState.history.length - 1];
                ctxSource.putImageData(lastData, 0, 0);
                updateUndoButton();
            }
        }

        function updateUndoButton() {
            const btn = document.getElementById('undo-bg-btn');
            if (AppState.history.length > 1) {
                btn.disabled = false;
                btn.classList.remove('text-gray-400');
                btn.classList.add('text-gray-700');
            } else {
                btn.disabled = true;
                btn.classList.add('text-gray-400');
                btn.classList.remove('text-gray-700');
            }
        }

        // --- 核心算法：中值切分法 (Median Cut) 颜色量化 ---
        function medianCut(pixels, maxColors) {
            let boxes = [pixels];
            while (boxes.length < maxColors) {
                // 找到包含颜色差异最大的盒子
                let boxIndex = -1;
                let maxRange = -1;
                let splitAxis = 'r';

                for (let i = 0; i < boxes.length; i++) {
                    if (boxes[i].length <= 1) continue;
                    
                    let minR = 255, maxR = 0, minG = 255, maxG = 0, minB = 255, maxB = 0;
                    for (let p of boxes[i]) {
                        if (p.r < minR) minR = p.r; if (p.r > maxR) maxR = p.r;
                        if (p.g < minG) minG = p.g; if (p.g > maxG) maxG = p.g;
                        if (p.b < minB) minB = p.b; if (p.b > maxB) maxB = p.b;
                    }
                    
                    let rangeR = maxR - minR;
                    let rangeG = maxG - minG;
                    let rangeB = maxB - minB;
                    let currentMaxRange = Math.max(rangeR, rangeG, rangeB);
                    
                    if (currentMaxRange > maxRange) {
                        maxRange = currentMaxRange;
                        boxIndex = i;
                        splitAxis = rangeR >= rangeG && rangeR >= rangeB ? 'r' : (rangeG >= rangeB ? 'g' : 'b');
                    }
                }

                if (boxIndex === -1) break;

                // 切分选中的盒子
                let box = boxes.splice(boxIndex, 1)[0];
                box.sort((a, b) => a[splitAxis] - b[splitAxis]);
                let median = Math.floor(box.length / 2);
                boxes.push(box.slice(0, median));
                boxes.push(box.slice(median));
            }

            // 计算每个盒子的平均色作为代表色
            return boxes.map(box => {
                let sumR = 0, sumG = 0, sumB = 0;
                for (let p of box) {
                    sumR += p.r; sumG += p.g; sumB += p.b;
                }
                return {
                    r: Math.round(sumR / box.length),
                    g: Math.round(sumG / box.length),
                    b: Math.round(sumB / box.length)
                };
            });
        }

        // --- 核心算法：像素化与颜色匹配 ---
        function generatePattern() {
            const gridWidth = AppState.gridWidth;
            const gridHeight = AppState.gridHeight;
            
            // 获取源图像数据
            const sourceWidth = sourceCanvas.width;
            const sourceHeight = sourceCanvas.height;
            const sourceData = ctxSource.getImageData(0, 0, sourceWidth, sourceHeight).data;

            let palette = PALETTES[AppState.brand] || PALETTES.perler;
            
            // 如果是 MARD，根据套装规格过滤颜色
            if (AppState.brand === 'mard') {
                const set = String(AppState.mardSet); 
                palette = palette.filter(c => {
                    const setGroups = {
                        '24': ['1'], '48': ['1', '2'], '72': ['1', '2', '3'], '96': ['1', '2', '3', '4'],
                        '120': ['A', 'B', 'C', 'D', 'E'], '144': ['A', 'B', 'C', 'D', 'E', '6'],
                        '216': ['A', 'B', 'C', 'D', 'E', '6', '9', '10', '11'],
                        '264': ['A', 'B', 'C', 'D', 'E', '6', '7', '8', '9', '10', '11']
                    };
                    const allowedGroups = setGroups[set] || [];
                    const isAllowed = c.groups.some(g => allowedGroups.includes(g));
                    if (set === '216' && ['C29', 'D10', 'B9', 'C12', 'D4'].includes(c.id)) return false;
                    if (set === '264' && c.id === 'C29') return false;
                    return isAllowed;
                });
            }

            // --- 颜色限制逻辑 ---
            let finalPalette = palette;
            const isColorLimitEnabled = document.getElementById('color-limit-toggle').checked;
            if (isColorLimitEnabled) {
                const maxColors = parseInt(document.getElementById('max-colors-slider').value);
                // 采样原始颜色用于量化
                let sampledPixels = [];
                const sampleStep = Math.max(1, Math.floor((gridWidth * gridHeight) / 2000)); 
                for (let y = 0; y < gridHeight; y++) {
                    for (let x = 0; x < gridWidth; x += sampleStep) {
                        const startX = Math.floor((x / gridWidth) * sourceWidth);
                        const startY = Math.floor((y / gridHeight) * sourceHeight);
                        const idx = (startY * sourceWidth + startX) * 4;
                        if (sourceData[idx + 3] > 128) { // 仅采样非透明像素
                            sampledPixels.push({ r: sourceData[idx], g: sourceData[idx + 1], b: sourceData[idx + 2] });
                        }
                    }
                }
                
                if (sampledPixels.length > 0) {
                    const representativeColors = medianCut(sampledPixels, maxColors);
                    // 将代表色映射到当前选中的品牌色库中，形成最终精简色板
                    const reducedPaletteMap = new Map();
                    representativeColors.forEach(rep => {
                        const nearest = findNearestColor(rep.r, rep.g, rep.b, palette);
                        reducedPaletteMap.set(nearest.id, nearest);
                    });
                    finalPalette = Array.from(reducedPaletteMap.values());
                }
            }

            AppState.pixelData = [];
            const isDitheringEnabled = document.getElementById('dithering-toggle').checked;
            
            // 准备误差扩散缓存
            let errorBuffer = null;
            if (isDitheringEnabled) {
                errorBuffer = new Float32Array(gridWidth * gridHeight * 3);
            }

            for (let y = 0; y < gridHeight; y++) {
                for (let x = 0; x < gridWidth; x++) {
                    // 1. 获取当前网格的平均原始颜色
                    const startX = Math.floor((x / gridWidth) * sourceWidth);
                    const startY = Math.floor((y / gridHeight) * sourceHeight);
                    const endX = Math.floor(((x + 1) / gridWidth) * sourceWidth);
                    const endY = Math.floor(((y + 1) / gridHeight) * sourceHeight);

                    let rSum = 0, gSum = 0, bSum = 0, count = 0, alphaSum = 0;
                    for (let sy = startY; sy < endY; sy++) {
                        for (let sx = startX; sx < endX; sx++) {
                            const idx = (sy * sourceWidth + sx) * 4;
                            rSum += sourceData[idx];
                            gSum += sourceData[idx + 1];
                            bSum += sourceData[idx + 2];
                            alphaSum += sourceData[idx + 3];
                            count++;
                        }
                    }

                    let r = count > 0 ? rSum / count : 255;
                    let g = count > 0 ? gSum / count : 255;
                    let b = count > 0 ? bSum / count : 255;
                    const a = count > 0 ? alphaSum / count : 0;

                    if (a < 128) {
                        AppState.pixelData.push({ id: 'NONE', r: 255, g: 255, b: 255, a: 0 });
                        continue;
                    }

                    // 2. 应用抖动误差
                    if (isDitheringEnabled) {
                        const errIdx = (y * gridWidth + x) * 3;
                        r = Math.max(0, Math.min(255, r + errorBuffer[errIdx]));
                        g = Math.max(0, Math.min(255, g + errorBuffer[errIdx + 1]));
                        b = Math.max(0, Math.min(255, b + errorBuffer[errIdx + 2]));
                    }

                    // 3. 匹配颜色
                    const matched = findNearestColor(r, g, b, finalPalette);
                    AppState.pixelData.push(matched);

                    // 4. 扩散误差 (Floyd-Steinberg)
                    if (isDitheringEnabled) {
                        const errR = r - matched.r;
                        const errG = g - matched.g;
                        const errB = b - matched.b;

                        const distributeError = (nx, ny, weight) => {
                            if (nx >= 0 && nx < gridWidth && ny >= 0 && ny < gridHeight) {
                                const nIdx = (ny * gridWidth + nx) * 3;
                                errorBuffer[nIdx] += errR * weight;
                                errorBuffer[nIdx + 1] += errG * weight;
                                errorBuffer[nIdx + 2] += errB * weight;
                            }
                        };

                        distributeError(x + 1, y, 7 / 16);
                        distributeError(x - 1, y + 1, 3 / 16);
                        distributeError(x, y + 1, 5 / 16);
                        distributeError(x + 1, y + 1, 1 / 16);
                    }
                }
            }

            goToStep(3);
            renderResult(AppState.pixelData, gridWidth, gridHeight);
            calculateStats();
            requestAnimationFrame(() => resetZoom());
        }

        function findNearestColor(r, g, b, palette) {
            let minDist = Infinity;
            let nearest = palette[0];

            for (let color of palette) {
                // 使用 Redmean 颜色距离算法 (比纯欧几里得距离更符合人眼感知)
                const rMean = (r + color.r) / 2;
                const dr = r - color.r;
                const dg = g - color.g;
                const db = b - color.b;
                
                // Redmean 权重公式
                const d = (2 + rMean / 256) * (dr * dr) + 
                          4 * (dg * dg) + 
                          (2 + (255 - rMean) / 256) * (db * db);

                if (d < minDist) {
                    minDist = d;
                    nearest = color;
                }
            }
            return nearest;
        }

        // --- 第三步：编辑/预览 ---
        const resultCanvas = document.getElementById('result-canvas');
        const ctxResult = resultCanvas.getContext('2d');
        const resultContainer = document.getElementById('result-container');
        
        let zoomState = {
            scale: 1,
            x: 0,
            y: 0,
            isDragging: false,
            lastX: 0,
            lastY: 0,
            lastDist: 0
        };
        
        let highlightedColorId = null;

        // 初始化预览图缩放逻辑
        function updateResultTransform() {
            // 使用 translate3d 提高性能，并确保 x, y 是相对于父容器的绝对偏移
            resultCanvas.style.transform = `translate3d(${zoomState.x}px, ${zoomState.y}px, 0) scale(${zoomState.scale})`;
            
            // 同步调整 transform-origin 为左上角，确保 translate 坐标系一致
            resultCanvas.style.transformOrigin = '0 0';
            
            const resetBtn = document.getElementById('zoom-reset-btn');
            if (zoomState.scale !== 1 || zoomState.x !== 0 || zoomState.y !== 0) {
                resetBtn.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                resetBtn.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        // 滚轮缩放
        resultContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = -e.deltaY;
            const factor = delta > 0 ? 1.1 : 0.9;
            
            // 限制缩放范围
            const minScale = 0.1;
            const maxScale = 10;
            const newScale = Math.min(Math.max(zoomState.scale * factor, minScale), maxScale);
            
            if (newScale !== zoomState.scale) {
                // 获取鼠标在容器中的位置
                const rect = resultContainer.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                // 计算鼠标位置相对于画布左上角的偏移 (在当前缩放级别下)
                // 公式: mouseX = zoomState.x + canvasX * zoomState.scale
                // => canvasX = (mouseX - zoomState.x) / zoomState.scale
                const canvasX = (mouseX - zoomState.x) / zoomState.scale;
                const canvasY = (mouseY - zoomState.y) / zoomState.scale;

                // 更新缩放比例
                const oldScale = zoomState.scale;
                zoomState.scale = newScale;

                // 根据新缩放比例调整 x, y，使鼠标指向的画布位置保持不变
                // 新坐标: zoomState.x = mouseX - canvasX * newScale
                zoomState.x = mouseX - canvasX * newScale;
                zoomState.y = mouseY - canvasY * newScale;

                updateResultTransform();
            }
        }, { passive: false });

        // 鼠标平移
        resultContainer.addEventListener('mousedown', (e) => {
            zoomState.isDragging = true;
            zoomState.lastX = e.clientX;
            zoomState.lastY = e.clientY;
            resultCanvas.style.transition = 'none';
            resultCanvas.classList.remove('cursor-grab');
            resultCanvas.classList.add('cursor-grabbing');
        });

        window.addEventListener('mousemove', (e) => {
            if (!zoomState.isDragging) return;
            const dx = e.clientX - zoomState.lastX;
            const dy = e.clientY - zoomState.lastY;
            zoomState.x += dx;
            zoomState.y += dy;
            zoomState.lastX = e.clientX;
            zoomState.lastY = e.clientY;
            updateResultTransform();
        });

        window.addEventListener('mouseup', () => {
            zoomState.isDragging = false;
            resultCanvas.classList.remove('cursor-grabbing');
            resultCanvas.classList.add('cursor-grab');
        });

        // 窗口大小变化时重置缩放以适配
        window.addEventListener('resize', () => {
            if (AppState.currentStep === 3) {
                resetZoom();
            }
        });

        // 触摸支持 (缩放和平移)
        resultContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                zoomState.isDragging = true;
                zoomState.lastX = e.touches[0].clientX;
                zoomState.lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                zoomState.lastDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
            resultCanvas.style.transition = 'none';
        }, { passive: false });

        resultContainer.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && zoomState.isDragging) {
                const dx = e.touches[0].clientX - zoomState.lastX;
                const dy = e.touches[0].clientY - zoomState.lastY;
                zoomState.x += dx;
                zoomState.y += dy;
                zoomState.lastX = e.touches[0].clientX;
                zoomState.lastY = e.touches[0].clientY;
                updateResultTransform();
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const factor = dist / zoomState.lastDist;
                const newScale = Math.min(Math.max(zoomState.scale * factor, 0.5), 10);
                
                // 以图片中心为基准缩放
                if (newScale !== zoomState.scale) {
                    // 获取画布中心点
                    const centerX = resultCanvas.width / 2;
                    const centerY = resultCanvas.height / 2;
                    
                    const actualFactor = newScale / zoomState.scale;
                    zoomState.x -= (centerX / zoomState.scale) * (actualFactor - 1) * zoomState.scale;
                    zoomState.y -= (centerY / zoomState.scale) * (actualFactor - 1) * zoomState.scale;
                    zoomState.scale = newScale;
                    zoomState.lastDist = dist;
                    updateResultTransform();
                }
            }
        }, { passive: false });

        resultContainer.addEventListener('touchend', () => {
            zoomState.isDragging = false;
        });

        function resetZoom() {
            // 获取容器尺寸
            const containerWidth = resultContainer.clientWidth;
            const containerHeight = resultContainer.clientHeight;
            
            // 获取画布尺寸
            const canvasWidth = resultCanvas.width;
            const canvasHeight = resultCanvas.height;
            
            // 计算适配比例 (留出 40px 边距)
            const padding = 40;
            const scaleX = (containerWidth - padding) / canvasWidth;
            const scaleY = (containerHeight - padding) / canvasHeight;
            const fitScale = Math.min(scaleX, scaleY, 1.0); 
            
            // 重置状态，居中展示
            // 计算居中位置: (容器尺寸 - 画布尺寸 * 缩放) / 2
            zoomState = { 
                scale: fitScale, 
                x: (containerWidth - canvasWidth * fitScale) / 2, 
                y: (containerHeight - canvasHeight * fitScale) / 2, 
                isDragging: false, 
                lastX: 0, 
                lastY: 0, 
                lastDist: 0 
            };
            
            resultCanvas.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            updateResultTransform();
            setTimeout(() => {
                resultCanvas.style.transition = 'none';
            }, 400);
        }

        function toggleColorHighlight(colorId) {
            if (highlightedColorId === colorId) {
                highlightedColorId = null;
            } else {
                highlightedColorId = colorId;
            }
            renderResult(AppState.pixelData, AppState.gridWidth, AppState.gridHeight);
            calculateStats();
        }

        function renderResult(pixelArray, gridWidth, gridHeight) {
            // 确定背景板规格和出血位
            const boardSize = Math.max(gridWidth, gridHeight) <= 52 ? 52 : 104;
            const margin = boardSize === 52 ? 2 : 4;
            const scale = 30; // 预览比例
            
            // 标尺占用一格空间，因此总尺寸增加 1 格
            const totalGrids = boardSize + 1;
            resultCanvas.width = totalGrids * scale;
            resultCanvas.height = totalGrids * scale;
            
            ctxResult.imageSmoothingEnabled = false;

            // 1. 绘制背景
            ctxResult.fillStyle = '#ffffff';
            ctxResult.fillRect(0, 0, resultCanvas.width, resultCanvas.height);

            // 2. 绘制网格背景 (从 1, 1 开始)
            const gridOffset = scale; // 标尺宽度

            // 计算图案在 52/104 内部的居中偏移
            const offsetX = Math.floor((boardSize - gridWidth) / 2);
            const offsetY = Math.floor((boardSize - gridHeight) / 2);

            // 绘制色块
            for (let y = 0; y < gridHeight; y++) {
                for (let x = 0; x < gridWidth; x++) {
                    const i = (y * gridWidth + x);
                    const color = pixelArray[i];
                    // 实际绘制坐标 = (网格偏移) + (内部偏移 + 坐标) * 缩放
                    const drawX = gridOffset + (x + offsetX) * scale;
                    const drawY = gridOffset + (y + offsetY) * scale;

                    ctxResult.fillStyle = `rgb(${color.r},${color.g},${color.b})`;
                    ctxResult.fillRect(drawX, drawY, scale, scale);
                }
            }

            // 3. 如果有高亮，应用遮罩
            if (highlightedColorId !== null) {
                ctxResult.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctxResult.fillRect(gridOffset, gridOffset, boardSize * scale, boardSize * scale);

                ctxResult.shadowBlur = 15;
                ctxResult.shadowColor = 'rgba(0,0,0,0.8)';
                ctxResult.shadowOffsetX = 2;
                ctxResult.shadowOffsetY = 4;

                for (let y = 0; y < gridHeight; y++) {
                    for (let x = 0; x < gridWidth; x++) {
                        const i = (y * gridWidth + x);
                        const color = pixelArray[i];
                        if (color.id === highlightedColorId) {
                            const drawX = gridOffset + (x + offsetX) * scale;
                            const drawY = gridOffset + (y + offsetY) * scale;
                            ctxResult.fillStyle = `rgb(${color.r},${color.g},${color.b})`;
                            ctxResult.fillRect(drawX + 1, drawY + 1, scale - 2, scale - 2);
                        }
                    }
                }
                ctxResult.shadowBlur = 0;
                ctxResult.shadowOffsetX = 0;
                ctxResult.shadowOffsetY = 0;
            }

            // 4. 绘制网格线、辅助线、标尺和 ID
            ctxResult.textAlign = 'center';
            ctxResult.textBaseline = 'middle';

            // 4.1 绘制基础网格线 (仅限内部区域)
            ctxResult.lineWidth = 1;
            ctxResult.strokeStyle = 'rgba(0,0,0,0.05)';
            for (let i = 0; i <= boardSize; i++) {
                const pos = gridOffset + i * scale;
                ctxResult.beginPath();
                ctxResult.moveTo(pos, gridOffset); ctxResult.lineTo(pos, resultCanvas.height);
                ctxResult.stroke();
                ctxResult.beginPath();
                ctxResult.moveTo(gridOffset, pos); ctxResult.lineTo(resultCanvas.width, pos);
                ctxResult.stroke();
            }

            // 4.2 绘制 ID 文字
            ctxResult.font = `bold ${Math.floor(scale * 0.4)}px Arial`;
            for (let y = 0; y < gridHeight; y++) {
                for (let x = 0; x < gridWidth; x++) {
                    const i = (y * gridWidth + x);
                    const color = pixelArray[i];
                    if (highlightedColorId === null || highlightedColorId === color.id) {
                        const drawX = gridOffset + (x + offsetX) * scale;
                        const drawY = gridOffset + (y + offsetY) * scale;
                        const yiq = ((color.r * 299) + (color.g * 587) + (color.b * 114)) / 1000;
                        ctxResult.fillStyle = yiq >= 128 ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.7)';
                        ctxResult.fillText(color.id, drawX + scale / 2, drawY + scale / 2);
                    }
                }
            }

            // 4.3 绘制辅助线 (虚线和实线)
            for (let gridIdx = 1; gridIdx < boardSize; gridIdx++) {
                const pos = gridOffset + gridIdx * scale;
                const isMarginLine = (gridIdx === margin || gridIdx === boardSize - margin);
                const isMajorLine = (gridIdx % 10 === 0);
                const isMinorLine = (gridIdx % 5 === 0);

                if (isMarginLine || isMinorLine) {
                    ctxResult.beginPath();
                    if (isMarginLine || isMajorLine) {
                        ctxResult.setLineDash([]);
                        ctxResult.strokeStyle = 'rgba(0,0,0,0.4)';
                        ctxResult.lineWidth = 2;
                    } else {
                        ctxResult.setLineDash([5, 5]);
                        ctxResult.strokeStyle = 'rgba(0,0,0,0.3)';
                        ctxResult.lineWidth = 1;
                    }
                    ctxResult.moveTo(pos, gridOffset); ctxResult.lineTo(pos, resultCanvas.height);
                    ctxResult.stroke();
                    ctxResult.moveTo(gridOffset, pos); ctxResult.lineTo(resultCanvas.width, pos);
                    ctxResult.stroke();
                    ctxResult.setLineDash([]);
                }
            }

            // 4.4 绘制外部标尺 (数字)
            ctxResult.font = `bold ${Math.floor(scale * 0.4)}px Arial`;
            ctxResult.fillStyle = 'rgba(0,0,0,0.6)';
            for (let i = 1; i <= boardSize; i++) {
                const textPos = gridOffset + (i - 1) * scale + scale / 2;
                // 上边缘标尺
                ctxResult.fillText(i.toString(), textPos, scale / 2);
                // 左边缘标尺
                ctxResult.fillText(i.toString(), scale / 2, textPos);
            }
        }

        function calculateStats() {
            const stats = {};
            let total = 0;
            AppState.pixelData.forEach(p => {
                if (!stats[p.id]) stats[p.id] = { ...p, count: 0 };
                stats[p.id].count++;
                total++;
            });

            const sorted = Object.values(stats).sort((a, b) => b.count - a.count);
            
            document.getElementById('total-beads-count').innerText = `共 ${total} 颗`;
            document.getElementById('color-types-count').innerText = `${sorted.length} 种颜色`;

            const container = document.getElementById('color-stats');
            container.innerHTML = sorted.map(c => {
                const yiq = ((c.r * 299) + (c.g * 587) + (c.b * 114)) / 1000;
                const textColor = yiq >= 128 ? 'text-black/80' : 'text-white/90';
                const isSelected = highlightedColorId === c.id;
                
                return `
                    <div onclick="toggleColorHighlight('${c.id}')" 
                        class="flex items-center justify-between px-3 py-1.5 rounded-full transition-all cursor-pointer active:scale-95 border-2 ${isSelected ? 'border-primary ring-2 ring-primary/30 shadow-lg' : 'border-transparent opacity-90 hover:opacity-100'}" 
                        style="background-color: rgb(${c.r},${c.g},${c.b})">
                        <span class="text-[11px] font-bold font-mono ${textColor}">${c.id}</span>
                        <span class="text-[10px] font-medium ml-2 ${textColor}">(${c.count})</span>
                    </div>
                `;
            }).join('');
        }

        // --- 第四步：导出 ---
        function initExportPreview() {
            const exportImg = document.getElementById('export-preview');
            exportImg.src = resultCanvas.toDataURL();
            document.getElementById('export-meta').innerText = `${AppState.gridWidth}x${AppState.gridHeight} • ${AppState.brand.charAt(0).toUpperCase() + AppState.brand.slice(1)}`;
        }

        function downloadImage() {
            const stats = {};
            AppState.pixelData.forEach(p => {
                if (!stats[p.id]) stats[p.id] = { ...p, count: 0 };
                stats[p.id].count++;
            });
            const sortedStats = Object.values(stats).sort((a, b) => b.count - a.count);

            // 1. 确定规格 (与预览保持一致)
            const boardSize = Math.max(AppState.gridWidth, AppState.gridHeight) <= 52 ? 52 : 104;
            const margin = boardSize === 52 ? 2 : 4;
            const exportScale = 60; // 导出比例
            const gridOffset = exportScale; // 标尺偏移
            
            const boardPxSize = (boardSize + 1) * exportScale;
            const offsetX = Math.floor((boardSize - AppState.gridWidth) / 2);
            const offsetY = Math.floor((boardSize - AppState.gridHeight) / 2);

            // 2. 计算底部清单布局
            const padding = 80;
            const cardWidth = 240;
            const cardHeight = 80;
            const gap = 30;
            const cardsPerRow = Math.max(1, Math.floor((boardPxSize - padding * 2 + gap) / (cardWidth + gap)));
            const rows = Math.ceil(sortedStats.length / cardsPerRow);
            const statsHeight = rows * (cardHeight + gap) + padding * 2 + 60; 
            
            const exportCanvas = document.createElement('canvas');
            const exportCtx = exportCanvas.getContext('2d');
            
            exportCanvas.width = boardPxSize;
            exportCanvas.height = boardPxSize + statsHeight;
            
            // 3. 填充整体背景 (白色)
            exportCtx.fillStyle = '#ffffff';
            exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            // 4. 绘制图案 (居中于 52/104 内部)
            exportCtx.textAlign = 'center';
            exportCtx.textBaseline = 'middle';
            exportCtx.font = `bold ${Math.floor(exportScale * 0.4)}px Arial`;

            for (let y = 0; y < AppState.gridHeight; y++) {
                for (let x = 0; x < AppState.gridWidth; x++) {
                    const i = (y * AppState.gridWidth + x);
                    const color = AppState.pixelData[i];
                    const drawX = gridOffset + (x + offsetX) * exportScale;
                    const drawY = gridOffset + (y + offsetY) * exportScale;

                    // 绘制色块
                    exportCtx.fillStyle = `rgb(${color.r},${color.g},${color.b})`;
                    exportCtx.fillRect(drawX, drawY, exportScale, exportScale);

                    // 绘制色块 ID
                    const yiq = ((color.r * 299) + (color.g * 587) + (color.b * 114)) / 1000;
                    exportCtx.fillStyle = yiq >= 128 ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.7)';
                    exportCtx.fillText(color.id, drawX + exportScale / 2, drawY + exportScale / 2);
                }
            }

            // 5. 绘制网格、辅助线和标尺
            // 5.1 基础网格 (仅限内部区域)
            exportCtx.lineWidth = 1;
            exportCtx.strokeStyle = 'rgba(0,0,0,0.1)';
            for (let i = 0; i <= boardSize; i++) {
                const pos = gridOffset + i * exportScale;
                exportCtx.beginPath();
                exportCtx.moveTo(pos, gridOffset); exportCtx.lineTo(pos, boardPxSize);
                exportCtx.stroke();
                exportCtx.beginPath();
                exportCtx.moveTo(gridOffset, pos); exportCtx.lineTo(boardPxSize, pos);
                exportCtx.stroke();
            }

            // 5.2 辅助线 (缝隙间)
            for (let gridIdx = 1; gridIdx < boardSize; gridIdx++) {
                const pos = gridOffset + gridIdx * exportScale;
                const isMarginLine = (gridIdx === margin || gridIdx === boardSize - margin);
                const isMajorLine = (gridIdx % 10 === 0);
                const isMinorLine = (gridIdx % 5 === 0);

                if (isMarginLine || isMinorLine) {
                    exportCtx.beginPath();
                    if (isMarginLine || isMajorLine) {
                        exportCtx.setLineDash([]);
                        exportCtx.strokeStyle = 'rgba(0,0,0,0.4)';
                        exportCtx.lineWidth = 3;
                    } else {
                        exportCtx.setLineDash([10, 10]);
                        exportCtx.strokeStyle = 'rgba(0,0,0,0.3)';
                        exportCtx.lineWidth = 2;
                    }
                    exportCtx.moveTo(pos, gridOffset); exportCtx.lineTo(pos, boardPxSize);
                    exportCtx.stroke();
                    exportCtx.moveTo(gridOffset, pos); exportCtx.lineTo(boardPxSize, pos);
                    exportCtx.stroke();
                    exportCtx.setLineDash([]);
                }
            }

            // 5.3 外部标尺 (数字)
            exportCtx.fillStyle = 'rgba(0,0,0,0.7)';
            exportCtx.font = `bold ${Math.floor(exportScale * 0.4)}px Arial`;
            exportCtx.textAlign = 'center';
            exportCtx.textBaseline = 'middle';
            for (let i = 1; i <= boardSize; i++) {
                const textPos = gridOffset + (i - 1) * exportScale + exportScale / 2;
                // 上边缘标尺
                exportCtx.fillText(i.toString(), textPos, exportScale / 2);
                // 左边缘标尺
                exportCtx.fillText(i.toString(), exportScale / 2, textPos);
            }

            // 6. 绘制清单标题
            const statsStartY = boardPxSize + padding;
            exportCtx.textAlign = 'left';
            exportCtx.textBaseline = 'top';
            exportCtx.fillStyle = '#333333';
            exportCtx.font = 'bold 48px Arial';
            exportCtx.fillText(`颜色清单 (Color List) - 共 ${sortedStats.length} 种颜色`, padding, statsStartY - 60);

            // 7. 绘制清单卡片 (胶囊样式)
            exportCtx.textBaseline = 'middle'; // 设置为垂直居中
            sortedStats.forEach((c, index) => {
                const row = Math.floor(index / cardsPerRow);
                const col = index % cardsPerRow;
                const x = padding + col * (cardWidth + gap);
                const y = statsStartY + row * (cardHeight + gap);

                // 绘制圆角矩形背景 (胶囊型)
                const radius = cardHeight / 2;
                exportCtx.beginPath();
                exportCtx.roundRect(x, y, cardWidth, cardHeight, radius);
                exportCtx.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
                exportCtx.fill();

                // 绘制文字 (ID + Count)
                const yiq = ((c.r * 299) + (c.g * 587) + (c.b * 114)) / 1000;
                exportCtx.fillStyle = yiq >= 128 ? 'rgba(0,0,0,0.8)' : 'rgba(255,255,255,0.9)';
                
                exportCtx.font = 'bold 32px Arial';
                exportCtx.textAlign = 'left';
                exportCtx.fillText(c.id, x + 30, y + cardHeight / 2);
                
                exportCtx.textAlign = 'right';
                exportCtx.font = 'bold 26px Arial';
                exportCtx.fillText(`(${c.count})`, x + cardWidth - 30, y + cardHeight / 2);
            });

            const link = document.createElement('a');
            link.download = `perler-pattern-${AppState.gridWidth}x${AppState.gridHeight}-${Date.now()}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }

        function downloadSVG() {
            // Basic SVG generation
            const scale = 20;
            const width = AppState.gridWidth * scale;
            const height = AppState.gridHeight * scale;
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;

            // Background
            svg += `<rect width="${width}" height="${height}" fill="#eee"/>`;

            AppState.pixelData.forEach((color, i) => {
                const x = (i % AppState.gridWidth) * scale;
                const y = Math.floor(i / AppState.gridWidth) * scale;
                svg += `<circle cx="${x + scale / 2}" cy="${y + scale / 2}" r="${scale / 2 - 1}" fill="rgb(${color.r},${color.g},${color.b})" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>`;
            });

            svg += `</svg>`;

            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = `perler-pattern-${Date.now()}.svg`;
            link.href = url;
            link.click();
        }

        // Custom image pixelation style via CSS
        const sheet = new CSSStyleSheet();
        sheet.replaceSync(`.image-pixelated { image-rendering: pixelated; }`);
        document.adoptedStyleSheets = [sheet];

    </script>
</body>
