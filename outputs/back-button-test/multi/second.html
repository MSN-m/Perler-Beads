<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="stylesheet" href="./styles.css">

<body data-kind="multi" data-page="2">
<main>
  <span id="badge">C · 两个 HTML 页面 · 兼容性实验</span>

  <details><summary>查看诊断记录</summary><pre id="diagnostics"></pre><ol id="events"></ol></details>
