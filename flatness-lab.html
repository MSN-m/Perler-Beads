<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片扁平化加工</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-100 p-6 text-slate-800"><main class="mx-auto max-w-6xl"><h1 class="text-2xl font-black">图片扁平化加工</h1><p class="mt-1 text-sm text-slate-500">中强度区域级扁平化，可下载 PNG。</p><section class="mt-5 grid gap-4 lg:grid-cols-[260px_1fr]"><aside class="rounded-2xl bg-white p-4 shadow"><label class="block font-bold">上传图片<input id="flat-image-input" type="file" accept="image/png,image/jpeg,image/webp" class="mt-2 block w-full text-xs"></label><button id="flat-generate-btn" disabled class="mt-5 w-full rounded-xl bg-slate-900 px-4 py-3 font-bold text-white disabled:opacity-40">开始扁平化</button><button id="flat-download-btn" disabled class="mt-3 w-full rounded-xl bg-pink-500 px-4 py-3 font-bold text-white disabled:opacity-40">下载 PNG</button><p id="flat-status" class="mt-3 text-xs text-slate-500">请先上传 PNG、JPG 或 WebP。</p></aside><section class="grid gap-4 md:grid-cols-2"><article class="overflow-hidden rounded-2xl bg-white shadow"><h2 class="border-b p-4 font-black">原图</h2><canvas id="flat-source-canvas" class="h-auto w-full"></canvas></article><article class="overflow-hidden rounded-2xl bg-white shadow ring-2 ring-pink-200"><h2 class="border-b border-pink-100 bg-pink-50 p-4 font-black">加工结果</h2><canvas id="flat-result-canvas" class="h-auto w-full"></canvas></article></section></section></main><script src="./src/flatness-processor.js"></script></body></html>
