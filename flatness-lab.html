<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扁平化对比实验室 · 拼豆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen bg-[#E7EBEE] text-slate-800">
<main class="mx-auto max-w-[1500px] px-5 py-6">
    <header class="mb-5 flex flex-wrap items-end justify-between gap-4">
        <div><p class="text-xs font-bold uppercase tracking-[0.18em] text-pink-500">Perler Beads Lab</p><h1 class="mt-1 text-2xl font-black">扁平化对比实验室</h1><p class="mt-1 text-sm text-slate-500">只比较扁平化风格，不进行拼豆调色板匹配</p></div>
        <a href="./index.html" class="rounded-xl bg-white px-4 py-2 text-sm font-bold shadow-sm">返回生成器</a>
    </header>
    <section class="grid gap-4 lg:grid-cols-[280px_minmax(0,1fr)]">
        <aside class="rounded-2xl bg-white p-4 shadow-sm">
            <h2 class="font-bold">统一测试参数</h2>
            <label class="mt-4 block text-sm font-bold">上传图片<input id="flat-image-input" type="file" accept="image/*" class="mt-2 block w-full text-xs"></label>
            <p class="mt-4 rounded-lg bg-slate-50 p-3 text-xs leading-5 text-slate-500">本页面不使用网格、不匹配拼豆颜色，只在原图像素层面比较扁平化风格。</p>
            <h2 class="mt-5 border-t border-slate-100 pt-4 font-bold">新方案参数</h2>
            <label class="mt-3 block text-xs font-bold">细节保留强度 <output id="flat-detail-output">0.70</output><input id="flat-detail" type="range" min="0" max="1.5" step="0.05" value="0.70" class="mt-1 w-full"></label>
            <label class="mt-3 block text-xs font-bold">背景简化强度 <output id="flat-background-output">0.45</output><input id="flat-background" type="range" min="0" max="1" step="0.05" value="0.45" class="mt-1 w-full"></label>
            <button id="flat-generate-btn" type="button" disabled class="mt-5 w-full rounded-xl bg-slate-900 px-4 py-3 text-sm font-bold text-white disabled:cursor-not-allowed disabled:opacity-40">生成对比结果</button>
            <p id="flat-status" class="mt-3 text-xs leading-5 text-slate-400">请先上传图片。</p>
        </aside>
        <section class="grid gap-4 lg:grid-cols-2">
            <article class="overflow-hidden rounded-2xl bg-white shadow-sm"><div class="border-b border-slate-100 px-4 py-3"><h2 class="font-black">正式页面效果</h2><p class="mt-1 text-xs text-slate-400">当前生成器的实际效果，作为对照。</p></div><div class="relative aspect-square bg-slate-50"><canvas id="flat-current-canvas" class="absolute inset-0 h-full w-full image-pixelated"></canvas><div id="flat-current-empty" class="absolute inset-0 grid place-items-center text-xs text-slate-400">上传图片后生成</div></div><div id="flat-current-stats" class="border-t border-slate-100 px-4 py-3 text-center text-xs text-slate-400">正式页面效果<br><b>—</b></div></article>
            <article class="overflow-hidden rounded-2xl bg-white shadow-sm"><div class="border-b border-slate-100 px-4 py-3"><h2 class="font-black">新扁平化方案</h2><p class="mt-1 text-xs text-slate-400">不使用网格，保留主体细节并简化背景。</p></div><div class="relative aspect-square bg-slate-50"><canvas id="flat-protected-canvas" class="absolute inset-0 h-full w-full object-contain"></canvas><div id="flat-protected-empty" class="absolute inset-0 grid place-items-center text-xs text-slate-400">上传图片后生成</div></div><div id="flat-protected-stats" class="border-t border-slate-100 px-4 py-3 text-center text-xs text-slate-400">色彩采样<br><b>—</b></div></article>
        </section>
    </section>
</main>
<script type="module" src="./src/flatness-lab.js?v=pure5"></script>
</body>
</html>
